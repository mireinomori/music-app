[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otofude-backend"
version = "0.1.0"
description = "Local audio transcription backend for Otofude"
requires-python = ">=3.9,<3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "python-multipart>=0.0.9,<1",
  "librosa>=0.10,<1",
  "pretty-midi>=0.2.10,<1",
  "mido>=1.3,<2",
  "music21>=8.3,<9; python_version < '3.10'",
  "music21>=9.7,<11; python_version >= '3.10'",
]

[project.optional-dependencies]
transcription = ["basic-pitch>=0.4,<1", "faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.pytest.ini_options]
pythonpath = ["backend"]
